<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зони поза НП України</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>Зони далі ніж <span id="km-label">5</span> км від НП</h1>
    <p class="hint">Червоним зафарбовані ділянки України, які знаходяться далі
      ніж <span id="km-label-2">5</span> км від найближчого населеного пункту
      (місто, селище, село, хутір).</p>
    <div id="slider"></div>
    <div class="ticks">
      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
      <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
    </div>
	<label class="layer-toggle">
  <input type="checkbox" id="toggle-rivers" checked>
  Показувати річки
</label>
<label class="layer-toggle">
  <input type="checkbox" id="toggle-streams">
  Показувати малі потічки
</label>
<label class="layer-toggle">
  <input type="checkbox" id="toggle-chernozems">
  Чорноземи
</label>
<label class="layer-toggle">
  <input type="checkbox" id="toggle-phaeozems">
  Темно-сірі лісові ґрунти
</label>
    <p class="footer">
      Дані: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>
    </p>
  </div>

  <div id="loading" class="hidden">Завантаження шару…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
